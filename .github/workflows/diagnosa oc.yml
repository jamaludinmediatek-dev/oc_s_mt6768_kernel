name: Diagnosa OC
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Frekuensi dan tegangan G75
        run: |
          F=drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6768/mtk_cpufreq_opp_table.h
          echo "=== OPP_TABLE 668-780 ==="
          awk 'NR>=668 && NR<=780 {printf "%d: %s\n", NR, $0}' $F

      - name: Metode PLL G75
        run: |
          F=drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6768/mtk_cpufreq_opp_table.h
          echo "=== OPP_TABLE 1083-1165 ==="
          awk 'NR>=1083 && NR<=1165 {printf "%d: %s\n", NR, $0}' $F

      - name: Tabel PV G75
        run: |
          F=drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6768/mtk_cpufreq_opp_pv_table.h
          echo "=== PV_TABLE 415-500 ==="
          awk 'NR>=415 && NR<=500 {printf "%d: %s\n", NR, $0}' $F
