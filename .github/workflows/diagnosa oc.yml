name: Diagnosa OC
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Isi folder cpufreq
        run: |
          D=drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6768
          echo "=== ISI FOLDER ==="
          ls -la $D
          echo "=== DEFINISI AWAL TABEL ==="
          sed -n '1,70p' $D/mtk_cpufreq_opp_table.h

      - name: Baris tabel OPP
        run: |
          D=drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6768
          echo "=== BARIS OP DAN NAMA TABEL ==="
          grep -n -E "static struct mt_cpu_freq_info|OP\(|FREQ|define" $D/mtk_cpufreq_opp_table.h | head -150

      - name: Batas jumlah OPP dan frekuensi
        run: |
          D=drivers/misc/mediatek/base/power/cpufreq_v1/src
          echo "=== NR_FREQ DAN BATAS ==="
          grep -rn -E "NR_FREQ|NR_OPP|MAX_FREQ|CPU_DVFS_FREQ0" $D --include=*.h | head -30 || true
          echo "=== PENANDA OC ==="
          grep -rn -i -E "overclock|oc_|_oc" $D --include=*.h --include=*.c | head -20 || true
