name: Cari nama
on: workflow_dispatch
jobs:
  cari:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Cari
        run: |
          echo "=== DEFCONFIG ==="
          ls arch/arm64/configs/ | grep -i -E "merlin|mt6768|lancelot|galahad"
          echo "=== TABEL OPP ==="
          find drivers/misc/mediatek -name "*opp*table*" | grep mt6768
          echo "=== VERSI KERNEL ==="
          head -5 Makefile
          echo "=== HOOK KSU ==="
          grep -n "do_execveat_common\|SYSCALL_DEFINE3(faccessat\|vfs_read\|vfs_statx\|vfs_fstatat" fs/exec.c fs/open.c fs/read_write.c fs/stat.c | head -30
          grep -n "SYSCALL_DEFINE4(reboot" kernel/reboot.c
