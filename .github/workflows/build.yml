name: Build Kernel KSU Next ManualHook OC
on:
  workflow_dispatch:
    inputs:
      big_khz:
        description: "Frekuensi cluster besar (kHz)"
        default: "2600000"
      little_khz:
        description: "Frekuensi cluster kecil (kHz)"
        default: "2400000"
      dv:
        description: "Tambahan tegangan (satuan 10uV, 1250 = 12.5mV)"
        default: "1250"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip device-tree-compiler curl git python2 lz4 cpio
          sudo apt-get install -y libtinfo5 || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Pasang KernelSU Next legacy
        run: curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Pasang hook manual di kernel
        run: |
          cat > patch_ksu.py <<'EOF'
          import sys

          def fail(m):
              print("GAGAL:", m)
              sys.exit(1)

          def rd(p):
              return open(p).read()

          def wr(p, s):
              open(p, "w").write(s)

          def before(s, anchor, text, start=0):
              i = s.find(anchor, start)
              if i < 0:
                  fail("titik tidak ditemukan: " + anchor)
              return s[:i] + text + s[i:]

          p = "fs/exec.c"
          s = rd(p)
          if "ksu_handle_execveat" not in s:
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n\n"
              s = before(s, "int do_execve(struct filename *filename,", decl)
              old = "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);"
              if old not in s:
                  fail("do_execve tidak ditemukan")
              s = s.replace(old, "#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n" + old)
              old2 = "\treturn do_execveat_common(fd, filename, argv, envp, flags);"
              if old2 in s:
                  s = s.replace(old2, "#ifdef CONFIG_KSU\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n" + old2)
              wr(p, s)
              print("OK", p)

          p = "fs/open.c"
          s = rd(p)
          if "ksu_handle_faccessat" not in s:
              a = "SYSCALL_DEFINE3(faccessat"
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n\n"
              s = before(s, a, decl)
              f = s.find(a)
              s = before(s, "\tif (mode & ~S_IRWXO)", "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\n", f)
              wr(p, s)
              print("OK", p)

          p = "fs/read_write.c"
          s = rd(p)
          if "ksu_handle_sys_read" not in s:
              a = "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)"
              decl = "#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);\n#endif\n\n"
              s = before(s, a, decl)
              f = s.find(a)
              s = before(s, "\tif (f.file) {", "#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_sys_read(fd, &buf, &count);\n#endif\n", f)
              wr(p, s)
              print("OK", p)

          p = "fs/stat.c"
          s = rd(p)
          if "ksu_handle_stat" not in s:
              a = "SYSCALL_DEFINE4(newfstatat"
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n\n"
              s = before(s, a, decl)
              f = s.find(a)
              s = before(s, "\terror = vfs_fstatat(dfd, filename, &stat, flag);", "#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n", f)
              wr(p, s)
              print("OK", p)

          p = "kernel/reboot.c"
          s = rd(p)
          if "ksu_handle_sys_reboot" not in s:
              a = "SYSCALL_DEFINE4(reboot"
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n"
              s = before(s, a, decl)
              f = s.find(a)
              s = before(s, "\t/* We only trust the superuser with rebooting the system. */", "#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\n", f)
              wr(p, s)
              print("OK", p)
          EOF
          python3 patch_ksu.py
          echo "=== HOOK TERPASANG ==="
          grep -rn "ksu_handle" fs kernel --include=*.c | grep -v "drivers/kernelsu" | head -20

      - name: Terapkan overclock
        env:
          BIG_KHZ: ${{ inputs.big_khz }}
          LITTLE_KHZ: ${{ inputs.little_khz }}
          DV: ${{ inputs.dv }}
        run: |
          cat > patch_oc.py <<'EOF'
          import os, re, sys

          D = "drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6768/"
          OPP = D + "mtk_cpufreq_opp_table.h"
          PV = D + "mtk_cpufreq_opp_pv_table.h"

          big = int(os.environ["BIG_KHZ"])
          lit = int(os.environ["LITTLE_KHZ"])
          dv = int(os.environ["DV"])

          def fail(m):
              print("GAGAL:", m)
              sys.exit(1)

          def sub1(s, pat, repl, what):
              new, n = re.subn(pat, repl, s, count=1)
              if n != 1:
                  fail("tidak ketemu: " + what)
              return new

          def up625(v):
              return ((v + 624) // 625) * 625

          s = open(OPP).read()
          s = sub1(s, r"(#define\s+CPU_DVFS_FREQ0_L_G75\s+)2500000", r"\g<1>%d" % big, "FREQ0_L_G75")
          s = sub1(s, r"(#define\s+CPU_DVFS_FREQ0_LL_G75\s+)2300000", r"\g<1>%d" % lit, "FREQ0_LL_G75")

          def bump(s, name, old):
              new = up625(old + dv) if dv > 0 else old
              if new > 115000:
                  fail("tegangan melebihi batas aman: %d" % new)
              print(name, old, "->", new)
              return sub1(s, r"(#define\s+%s\s+)%d" % (name, old), r"\g<1>%d" % new, name)

          s = bump(s, "CPU_DVFS_VOLT0_VPROC2_G75", 109750)
          s = bump(s, "CPU_DVFS_VOLT0_VPROC1_G75", 103625)
          open(OPP, "w").write(s)

          p = open(PV).read()
          i = p.find("FY_G75Tbl[")
          if i < 0:
              fail("FY_G75Tbl tidak ketemu")
          head, tail = p[:i], p[i:]
          tail = sub1(tail, r"\{\s*2300,\s*81,\s*1,\s*1\s*\}", "{ %d, 83, 1, 1 }" % (lit // 1000), "pv 2300")
          tail = sub1(tail, r"\{\s*2500,\s*94,\s*1,\s*1\s*\}", "{ %d, 96, 1, 1 }" % (big // 1000), "pv 2500")
          open(PV, "w").write(head + tail)
          print("OK overclock")
          EOF
          python3 patch_oc.py
          echo "=== PERUBAHAN OC ==="
          git diff -U0 -- drivers/misc/mediatek/base/power/cpufreq_v1 | grep -E "^[+-][^+-]" || true
          echo "=== INFO EEM (hanya info) ==="
          grep -rn -i "freq_base" drivers/misc/mediatek --include=*.h --include=*.c | head -20 || true

      - name: Cari defconfig dan aktifkan manual hook
        run: |
          DEF=$(ls arch/arm64/configs | grep -i merlin | head -1)
          [ -z "$DEF" ] && DEF=$(ls arch/arm64/configs | grep -i mt6768 | head -1)
          echo "Pakai defconfig: $DEF"
          test -n "$DEF"
          echo "DEF=$DEF" >> $GITHUB_ENV
          printf 'CONFIG_KSU=y\nCONFIG_KSU_MANUAL_HOOK=y\n# CONFIG_KSU_SYSCALL_TABLE_HOOK is not set\n# CONFIG_KSU_KPROBES_HOOK is not set\n' >> arch/arm64/configs/$DEF

      - name: Download Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-13/aaa

      - name: Build
        run: |
          export PATH=$PWD/clang-13/aaa/bin:$PATH
          MK="make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          $MK $DEF > build.log 2>&1 || true
          $MK >> build.log 2>&1 || true
          [ -f out/arch/arm64/boot/Image.gz-dtb ] || $MK Image.gz-dtb >> build.log 2>&1 || true
          echo "=== MODE HOOK ==="
          grep -n "Hook mode" build.log | head -3 || true
          echo "=== PESAN ERROR ==="
          grep -n -E "error:|\*\*\*|Stop\." build.log | grep -v -E "ERR_get_error|extract-cert" | head -40 || true
          echo "=== 40 BARIS TERAKHIR ==="
          tail -40 build.log

      - name: Cek hasil build
        run: test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Buat zip dengan template Shas
        run: |
          git clone --depth=1 --filter=blob:none --sparse -b shas-noc https://github.com/Shas45558/shas-dream-oc-mt6768-a11 tpl
          cd tpl && git sparse-checkout set AnyKernel3-master && cd ..
          cp -r tpl/AnyKernel3-master AK3
          rm -f AK3/*.zip AK3/*-dtb AK3/Image*
          rm -rf AK3/ramdisk/overlay.d
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          cd AK3 && zip -r9 ../kernel-merlin-ksunext-oc.zip . -x ".git*"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin-ksunext-oc
          path: |
            kernel-merlin-ksunext-oc.zip
            out/arch/arm64/boot/Image.gz-dtb
